server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Статика учебного проекта: запрещаем кэширование.
    # Без этих заголовков браузер применяет «heuristic caching» по ETag/Last-Modified
    # и после пересборки образа продолжает отдавать старые .js/.css — из-за этого
    # в UI появляются новые элементы разметки (из index.html), но не работает
    # логика из устаревшего скрипта.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Проксирование API-запросов на backend-контейнер
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: все остальные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}