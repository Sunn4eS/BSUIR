<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Скачивание фоток</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>🖼️ Скачивание фоток c сайта</h1>
    <form method="post" action="download.php">
        <label for="url">Введите URL:</label>
        <input type="text" id="url" name="url" required placeholder="https://www.wallpapercave.com/..." size="50">

        <label for="max">Максимум изображений с одной страницы:</label>
        <input type="number" id="max" name="max" min="1" max="50" value="5">

        <label for="maxLinks">Максимум разделов (подстраниц):</label>
        <input type="number" id="maxLinks" name="maxLinks" min="1" max="50" value="3">

        <button type="submit">Скачать</button>
    </form>
</div>
</body>
</html>
